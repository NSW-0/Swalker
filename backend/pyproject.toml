[project]
name = "swalker-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
# Frozen research file, copied verbatim (see its header). Not ours to restyle.
extend-exclude = ["app/ml/combined_glfe_mstfe.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF"]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:anyio"
